    <main class="artwork-directory">

        <p class="artwork-intro">
            Click on any artwork to view additional augmented reality (AR) layers.
        </p>

        <ul id="artwork-list" class="minimal-list"></ul>
    </main>

    <script>
        document.getElementById('site-title').textContent = exhibitionConfig.title;
        document.getElementById('artist-name').textContent = exhibitionConfig.artist;

        const listContainer = document.getElementById('artwork-list');

        for (const [id, data] of Object.entries(exhibitionConfig.artworks)) {

            const listItem = document.createElement('li');
            listItem.className = 'artwork-item';


            const link = document.createElement('a');
            link.href = `artwork.html?id=${id}`;
            link.className = 'artwork-link';

            link.innerHTML = `
                <strong>${data.title}</strong>
                <span class="artwork-desc">${data.description}</span>
            `;

            listItem.appendChild(link);
            listContainer.appendChild(listItem);
        }
    </script>
